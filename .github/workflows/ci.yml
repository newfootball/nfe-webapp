name: CI

on:
    pull_request:
        types:
          - opened
          - synchronize
    push:
      branches:
        - main
        - 'v**'
    merge_group: {}

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                    fetch-depth: 0

            - uses: oven-sh/setup-bun@v1
              with:
                bun-version: latest

            - name: Cache Bun dependencies
              uses: actions/cache@v4
              with:
                path: ~/.bun/install/cache
                key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
                restore-keys: |
                  ${{ runner.os }}-bun-

            - name: Install
              run: bun install

            - name: Biome
              run: bun run lint

            - name: Typecheck
              run: bun run typecheck

            - name: Knip
              run: bunx knip --no-exit-code

    start-foundation:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: 24
            - uses: oven-sh/setup-bun@v2
              with:
                bun-version: 1.3.14
            - name: Install Next dependencies for shared UI
              run: bun install --frozen-lockfile
            - name: Install Start dependencies
              run: bun install --cwd apps/start --frozen-lockfile
            - name: Build Start
              run: bun run build:start
            - name: Typecheck Start
              run: bun run typecheck:start
            - name: Install smoke browser
              working-directory: apps/start
              run: bunx playwright install --with-deps chromium
            - name: Smoke built Start
              run: bun run smoke:start

    migration-probe:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: tools/migration-probe
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                bun-version: 1.3.14
            - name: Install isolated probe dependencies
              run: bun install --frozen-lockfile
            - name: Typecheck probe
              run: bun run typecheck
            - name: Test B2 signer guards (no credentials)
              run: bun run test:b2
            - name: B2 runtime remains opt-in (not_run)
              run: bun run probe:b2
